server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass https://erp1backend-production.up.railway.app/api/;

        # Enables SNI so Railway's router can establish the SSL handshake
        proxy_ssl_server_name on;
        proxy_ssl_name erp1backend-production.up.railway.app;

        # Force HTTP 1.1 for connection reuse
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Explicit backend host header
        proxy_set_header Host erp1backend-production.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
